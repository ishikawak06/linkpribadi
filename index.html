<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkVault Pro - Ultimate</title>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Marked & DOMPurify (Mencegah XSS) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* LIGHT MODE DEFAULT */
        :root {
            --bg: #f4f6f8; --bg2: #ffffff; --bg3: #eef2f6; --border: #e0e6ed;
            --accent: #5a4bdf; --accent2: #7c6aff; --text: #1e2022; --text2: #525a65; --text3: #8a94a6;
            --danger: #fa5252; --success: #20c997; --pin: #f59f00; --r: 12px;
        }

        /* DARK MODE */
        [data-theme="dark"] {
            --bg: #07070f; --bg2: #0d0d1c; --bg3: #12122a; --border: #1c1c38;
            --accent: #7c6aff; --accent2: #a78bfa; --text: #e4e4f4; --text2: #8888aa; --text3: #4a4a72;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; transition: background 0.3s, color 0.3s; }

        /* UTIL & LOGIN */
        #pw-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; position: fixed; inset: 0; z-index: 999; background: var(--bg); }
        .pw-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 52px 44px; width: 360px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .pw-wrap input { width: 100%; padding: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-align: center; outline: none; margin: 20px 0; letter-spacing: 5px; }
        .btn-primary { padding: 12px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary:hover { background: var(--accent2); }
        
        #app { display: none; min-height: 100vh; flex-direction: column; }
        
        /* HEADER & NAVIGATION */
        header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 20px; height: 62px; display: flex; align-items: center; gap: 14px; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 21px; font-weight: 800; } .logo b { color: var(--accent2); }
        
        .main-nav { display: flex; gap: 5px; margin-left: 20px; }
        .nav-tab { background: transparent; border: none; padding: 8px 12px; font-weight: 600; color: var(--text2); cursor: pointer; border-radius: 6px; }
        .nav-tab.active { background: var(--bg3); color: var(--accent); }
        .nav-tab:hover { color: var(--text); }

        .search-wrap { flex: 1; display: flex; gap: 10px; max-width: 500px; margin-left: auto;}
        .search-wrap input, .search-wrap select { padding: 9px 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); outline: none; font-size: 13px; }
        .search-wrap input { flex: 1; }
        .hdr-btns { display: flex; gap: 8px; }
        .btn-ico { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; display: flex; align-items:center; justify-content:center;}

        /* MAIN CONTENT AREA */
        main { padding: 24px 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .links-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; display: none; }
        .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }

        /* CARDS */
        .lcard { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; position: relative; display: flex; flex-direction: column; overflow: hidden; transition: 0.2s;}
        .lcard:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.05);}
        .lcard.pinned { border-color: rgba(245, 159, 0, .4); }
        .card-img { width: 100%; height: 130px; background: var(--bg3); object-fit: cover; border-bottom: 1px solid var(--border); }
        
        .status-badge { position: absolute; top: 10px; left: 10px; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; color: white; z-index: 10; backdrop-filter: blur(4px);}
        .status-404 { background: rgba(250, 82, 82, 0.9); }
        .status-200 { background: rgba(32, 201, 151, 0.9); display: none; }

        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
        .card-actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; background: var(--bg2); padding: 4px; border-radius: 8px; border: 1px solid var(--border); opacity: 0; transition: .2s; }
        .lcard:hover .card-actions { opacity: 1; }
        .act-btn, .cb-bulk { width: 26px; height: 26px; border-radius: 5px; border: none; background: transparent; color: var(--text); cursor: pointer; display: flex; align-items:center; justify-content:center;}
        .act-btn:hover { background: var(--bg3); }

        .c-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .c-title { font-weight: bold; font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .c-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 12px; flex: 1; }
        .c-desc.mkd p { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 4px; }
        
        .card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; flex-wrap: wrap; gap: 8px;}
        .tags-wrap { display: flex; gap: 4px; flex-wrap: wrap; }
        .tag-badge { padding: 3px 8px; border-radius: 20px; font-size: 10px; font-family: monospace; border: 1px solid var(--border); }
        
        /* READ STATUS */
        .read-status { font-size: 10px; padding: 4px 8px; border-radius: 4px; background: var(--bg3); color: var(--text2); border: none; cursor: pointer;}
        .read-status.unread { background: rgba(250, 82, 82, 0.1); color: var(--danger); }
        .read-status.read { background: rgba(32, 201, 151, 0.1); color: var(--success); }

        /* MODALS */
        .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;}
        .fg { margin-bottom: 14px; } .fg label { display: block; font-size: 11px; color: var(--text3); margin-bottom: 6px; }
        .fg input, .fg textarea, .fg select { width: 100%; padding: 10px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); }
        
        /* NOTES UI */
        .note-item { background: var(--bg3); padding: 12px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--accent); }
        .note-date { font-size: 10px; color: var(--text3); margin-bottom: 4px; display: block; }
        
        /* BULK ACTION BAR */
        .bulk-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg2); border: 1px solid var(--accent); padding: 12px 24px; border-radius: 30px; display: none; gap: 16px; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); z-index: 150; }
        .bulk-bar.active { display: flex; }
        .btn-action { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px;}
        .btn-action.danger { color: var(--danger); border-color: var(--danger); }
    </style>
</head>
<body>

    <!-- PASSWORD SCREEN -->
    <div id="pw-screen">
        <div class="pw-card">
            <h2>LinkVault <span style="color:var(--accent)">Pro</span></h2>
            <div class="pw-wrap"><input type="password" id="pw-in" placeholder="••••••" autocomplete="off"></div>
            <button class="btn-primary" style="width:100%" onclick="checkPw()">Masuk</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <header>
            <div class="logo">Link<b>Vault</b></div>
            
            <div class="main-nav">
                <button class="nav-tab active" onclick="switchView('grid')">🏠 Semua Link</button>
                <button class="nav-tab" onclick="switchView('reading')">📚 Reading List</button>
                <button class="nav-tab" onclick="switchView('dashboard')">📊 Dasbor</button>
            </div>

            <div class="search-wrap" id="nav-filters">
                <input type="text" id="q" placeholder="Cari..." oninput="renderGrid()">
                <select id="f-folder" onchange="renderGrid()">
                    <option value="all">📁 Semua Folder</option>
                </select>
            </div>

            <div class="hdr-btns">
                <button class="btn-ico" title="Cek Link Rusak" onclick="checkBrokenLinks()">🩺</button>
                <button class="btn-ico" title="Kelola Kategori & Folder" onclick="openManage()">🗂</button>
                <button class="btn-ico" title="Ganti Tema" onclick="toggleTheme()">🌓</button>
                <button class="btn-primary" onclick="openAdd()">＋ Tambah</button>
            </div>
        </header>

        <main>
            <!-- GRID VIEW (HOME & READING LIST) -->
            <div class="links-grid" id="grid"></div>

            <!-- DASHBOARD VIEW -->
            <div class="dashboard-grid" id="dashboard-view">
                <div class="stat-card">
                    <h3>📈 Pertumbuhan Koleksi</h3>
                    <canvas id="chartGrowth"></canvas>
                </div>
                <div class="stat-card">
                    <h3>🏷 Distribusi Tag</h3>
                    <canvas id="chartTags"></canvas>
                </div>
                <div class="stat-card" style="grid-column: 1 / -1;">
                    <h3>🔥 Top Link Sering Dibuka</h3>
                    <ul id="top-links-list" style="list-style:none; margin-top:12px;"></ul>
                </div>
            </div>
        </main>
        
        <!-- BULK BAR -->
        <div class="bulk-bar" id="bulk-bar">
            <span id="bulk-count" style="font-weight:bold; font-size:13px;">0 terpilih</span>
            <button class="btn-action danger" onclick="bulkDelete()">Hapus Massal</button>
            <button class="btn-action" onclick="clearBulk()">Batal</button>
        </div>
    </div>

    <!-- MODAL: ADD/EDIT LINK -->
    <div class="overlay" id="m-link" style="display:none" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal">
            <h2 id="m-link-ttl">Tambah Link</h2>
            <div class="fg">
                <label>URL *</label>
                <input type="url" id="f-url" onblur="fetchOGData()" placeholder="https://...">
            </div>
            <div class="fg">
                <label>JUDUL *</label>
                <input type="text" id="f-ttl">
            </div>
            <div class="fg">
                <label>DESKRIPSI (Mendukung Markdown)</label>
                <textarea id="f-dsc" placeholder="# Heading&#10;- Point 1"></textarea>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="fg" style="flex:1">
                    <label>FOLDER</label>
                    <select id="f-sel-folder"><option value="">-- Tanpa Folder --</option></select>
                </div>
                <div class="fg" style="flex:1">
                    <label>STATUS BACA</label>
                    <select id="f-read-status">
                        <option value="unread">Belum Dibaca (Read Later)</option>
                        <option value="reading">Sedang Dibaca</option>
                        <option value="read">Selesai</option>
                    </select>
                </div>
            </div>
            <div class="fg">
                <label>TAGS</label>
                <div style="display:flex; flex-wrap:wrap; gap:6px; background:var(--bg3); padding:8px; border-radius:8px;" id="f-tags-container"></div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-action" onclick="document.getElementById('m-link').style.display='none'">Batal</button>
                <button class="btn-primary" onclick="saveLink()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODAL: MANAGE (TAGS & FOLDERS) -->
    <div class="overlay" id="m-manage" style="display:none" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal">
            <h2>🗂 Kelola Kategori</h2>
            
            <h3 style="font-size:14px; margin-top:16px; margin-bottom:8px;">📁 Folders</h3>
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input type="text" id="new-folder-name" placeholder="Nama Folder Baru..." style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg3); color:var(--text);">
                <button class="btn-primary" style="padding:8px 16px;" onclick="saveFolder()">Tambah</button>
            </div>
            <div id="manage-folder-list" style="margin-bottom:20px; display:flex; flex-direction:column; gap:4px;"></div>

            <h3 style="font-size:14px; margin-bottom:8px;">🏷 Tags</h3>
            <div style="display:flex; gap:8px; margin-bottom:12px;">
                <input type="text" id="new-tag-name" placeholder="Nama Tag..." style="flex:1; padding:8px; border-radius:6px; border:1px solid var(--border); background:var(--bg3); color:var(--text);">
                <input type="color" id="new-tag-color" value="#5a4bdf" style="width:40px; height:36px; border:none; border-radius:6px; cursor:pointer; background:transparent;">
                <button class="btn-primary" style="padding:8px 16px;" onclick="saveTag()">Tambah</button>
            </div>
            <div id="manage-tag-list" style="max-height: 150px; overflow-y: auto; display:flex; flex-direction:column; gap:4px;"></div>
            
            <div style="display:flex; justify-content:flex-end; margin-top:16px;">
                <button class="btn-action" onclick="document.getElementById('m-manage').style.display='none'">Tutup</button>
            </div>
        </div>
    </div>

    <!-- MODAL: NOTES & HIGHLIGHTS -->
    <div class="overlay" id="m-notes" style="display:none" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal">
            <h2>📝 Catatan & Highlight</h2>
            <p id="note-link-title" style="font-size:12px; color:var(--text2); margin-bottom:16px; font-weight:bold;"></p>
            
            <div id="notes-list" style="max-height:250px; overflow-y:auto; margin-bottom:16px;"></div>
            
            <textarea id="new-note-text" placeholder="Tambahkan kutipan atau pemikiran tentang link ini..." style="width:100%; height:80px; padding:10px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; color:var(--text); margin-bottom:10px;"></textarea>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-action" onclick="document.getElementById('m-notes').style.display='none'">Tutup</button>
                <button class="btn-primary" onclick="saveNote()">Simpan Catatan</button>
            </div>
        </div>
    </div>

    <script>
        // CONFIG SUPABASE
        const SB_URL = 'https://tdoxttalxwunrweypybw.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkb3h0dGFseHd1bnJ3ZXlweWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTQ4NDIsImV4cCI6MjA5MzY3MDg0Mn0.X9-1HiW9uge5s2-Q85VF8hAgKp-u01xzf5JEGaoy0Rg';
        const PASS = '141516';
        
        let db, tags = [], folders = [], links = [], link_tags = [], highlights = [];
        let currentView = 'grid'; // grid, reading, dashboard
        let editId = null, activeNoteLinkId = null, tempOgImage = '';
        let selectedLinks = new Set();
        let chartInstances = {};

        // 1. THEME SWITCHER (Light by default)
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const target = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            if(chartInstances.tags) renderCharts(); // Redraw charts colors
        }
        if(localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        function checkPw() {
            if (document.getElementById('pw-in').value === PASS) {
                document.getElementById('pw-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                init();
            }
        }

        async function init() {
            db = supabase.createClient(SB_URL, SB_KEY);
            await loadData();
        }

        async function loadData() {
            const [t, f, l, lt, h] = await Promise.all([
                db.from('tags').select('*'),
                db.from('folders').select('*'),
                db.from('links').select('*'),
                db.from('link_tags').select('*'),
                db.from('highlights').select('*')
            ]);
            tags = t.data || []; folders = f.data || []; links = l.data || []; 
            link_tags = lt.data || []; highlights = h.data || [];
            
            populateFolderSelects();
            renderGrid();
        }

        // 2. VIEW CONTROLLER
        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.nav-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('grid').style.display = view === 'dashboard' ? 'none' : 'grid';
            document.getElementById('dashboard-view').style.display = view === 'dashboard' ? 'grid' : 'none';
            document.getElementById('nav-filters').style.display = view === 'dashboard' ? 'none' : 'flex';

            if(view === 'dashboard') renderCharts();
            else renderGrid();
        }

        // 3. SECURE RENDER GRID (XSS FIX & READING LIST)
        function renderGrid() {
            const g = document.getElementById('grid');
            const q = document.getElementById('q').value.toLowerCase();
            const fFilter = document.getElementById('f-folder').value;

            let data = links.filter(l => {
                const matchQ = l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q);
                const matchF = fFilter === 'all' || l.folder_id === fFilter;
                const matchV = currentView === 'reading' ? (l.read_status === 'unread' || l.read_status === 'reading') : true;
                return matchQ && matchF && matchV;
            });

            data.sort((a,b) => b.is_pinned - a.is_pinned || new Date(b.created_at) - new Date(a.created_at));

            g.innerHTML = data.map(l => {
                const lTags = link_tags.filter(lt => lt.link_id === l.id).map(lt => tags.find(t => t.id === lt.tag_id)).filter(Boolean);
                const tagHtml = lTags.map(t => `<span class="tag-badge" style="background:${t.color}15;color:${t.color}">${t.name}</span>`).join('');
                const imgHtml = l.og_image ? `<img src="${l.og_image}" class="card-img" onerror="this.style.display='none'">` : '';
                const isSel = selectedLinks.has(l.id) ? 'checked' : '';
                
                // SANITASI XSS dengan DOMPurify sebelum di render!
                const rawDesc = l.description || '';
                const safeDesc = DOMPurify.sanitize(marked.parse(rawDesc)); 
                
                // Badge Pengecekan Link
                let badgeHTML = '';
                if(l.status_code && l.status_code !== 200) badgeHTML = `<div class="status-badge status-404">Error ${l.status_code}</div>`;
                
                // Label Status Baca
                let rStatus = l.read_status === 'read' ? '✓ Selesai' : (l.read_status === 'reading' ? '📖 Sedang dibaca' : '📌 Belum dibaca');

                return `
                <div class="lcard ${l.is_pinned ? 'pinned' : ''}" onclick="openUrl('${l.id}', '${l.url}')">
                    ${badgeHTML}
                    ${imgHtml}
                    <div class="card-actions">
                        <input type="checkbox" class="cb-bulk" ${isSel} onclick="event.stopPropagation(); toggleBulk('${l.id}')">
                        <button class="act-btn" title="Catatan" onclick="event.stopPropagation(); openNotes('${l.id}', '${l.title.replace(/'/g, "\\'")}')">📝</button>
                        <button class="act-btn" onclick="event.stopPropagation(); togglePin('${l.id}', ${!l.is_pinned})">📌</button>
                        <button class="act-btn" onclick="event.stopPropagation(); openEdit('${l.id}')">✏️</button>
                    </div>
                    <div class="card-body">
                        <div class="c-meta"><div class="c-title">${l.title}</div></div>
                        <div class="c-desc mkd">${safeDesc}</div>
                        <div class="card-foot">
                            <div class="tags-wrap">${tagHtml}</div>
                        </div>
                        <div class="card-foot" style="margin-top:12px; border-top:1px solid var(--border); padding-top:8px;">
                            <button class="read-status ${l.read_status}" onclick="event.stopPropagation(); cycleReadStatus('${l.id}', '${l.read_status}')">${rStatus}</button>
                            <span style="font-size:10px; color:var(--text3)">👁 ${l.view_count || 0}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // 4. BROKEN LINK CHECKER
        async function checkBrokenLinks() {
            if(!confirm("Proses ini akan mengecek status HTTP seluruh link via Proxy. Lanjutkan?")) return;
            
            for(let l of links) {
                try {
                    // Menggunakan CORS proxy pubik untuk cek status (HEAD request agar ringan)
                    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(l.url)}`, { method: 'HEAD' });
                    if(l.status_code !== res.status) {
                        l.status_code = res.status;
                        await db.from('links').update({status_code: res.status}).eq('id', l.id);
                    }
                } catch(e) {
                    l.status_code = 404; // Asumsikan rusak jika timeout/gagal
                    await db.from('links').update({status_code: 404}).eq('id', l.id);
                }
            }
            renderGrid();
            alert("Pengecekan link selesai!");
        }

        // 5. STATS DASHBOARD (Chart.js)
        function renderCharts() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const tColor = isDark ? '#e4e4f4' : '#1e2022';
            const gColor = isDark ? '#1c1c38' : '#e0e6ed';
            Chart.defaults.color = tColor;

            // Chart 1: Tags Distribution
            const tagCounts = tags.map(t => link_tags.filter(lt => lt.tag_id === t.id).length);
            if(chartInstances.tags) chartInstances.tags.destroy();
            chartInstances.tags = new Chart(document.getElementById('chartTags'), {
                type: 'doughnut',
                data: { labels: tags.map(t=>t.name), datasets: [{ data: tagCounts, backgroundColor: tags.map(t=>t.color), borderWidth: 0 }] },
                options: { plugins: { legend: { position: 'right' } } }
            });

            // Chart 2: Collection Growth (dummy grouping by month for demo)
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun'];
            const dataG = [0,0,0,0,0,links.length]; // Simple mock
            if(chartInstances.growth) chartInstances.growth.destroy();
            chartInstances.growth = new Chart(document.getElementById('chartGrowth'), {
                type: 'bar',
                data: { labels: months, datasets: [{ label: 'Link Baru', data: dataG, backgroundColor: '#5a4bdf', borderRadius: 4 }] },
                options: { scales: { x: { grid: { display: false } }, y: { grid: { color: gColor } } } }
            });

            // Top Links
            const top = [...links].sort((a,b)=>b.view_count - a.view_count).slice(0,5);
            document.getElementById('top-links-list').innerHTML = top.map(l => `
                <li style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
                    <span style="font-weight:600; font-size:13px; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; max-width:70%">${l.title}</span>
                    <span style="color:var(--text3); font-size:12px;">👁 ${l.view_count} views</span>
                </li>
            `).join('');
        }

        // 6. NOTES & HIGHLIGHTS
        function openNotes(linkId, title) {
            activeNoteLinkId = linkId;
            document.getElementById('note-link-title').innerText = "Link: " + title;
            document.getElementById('new-note-text').value = '';
            renderNotesList();
            document.getElementById('m-notes').style.display = 'flex';
        }
        function renderNotesList() {
            const list = document.getElementById('notes-list');
            const lNotes = highlights.filter(h => h.link_id === activeNoteLinkId);
            if(lNotes.length === 0) { list.innerHTML = '<p style="font-size:12px; color:var(--text3)">Belum ada catatan.</p>'; return; }
            
            list.innerHTML = lNotes.map(h => `
                <div class="note-item">
                    <span class="note-date">${new Date(h.created_at).toLocaleString('id-ID')}</span>
                    <div style="font-size:13px; line-height:1.5">${DOMPurify.sanitize(marked.parse(h.content))}</div>
                </div>
            `).join('');
        }
        async function saveNote() {
            const content = document.getElementById('new-note-text').value.trim();
            if(!content) return;
            const {data} = await db.from('highlights').insert([{ link_id: activeNoteLinkId, content }]).select().single();
            highlights.push(data);
            renderNotesList();
            document.getElementById('new-note-text').value = '';
        }

        // FOLDERS & MANAGE
        function populateFolderSelects() {
            const f1 = document.getElementById('f-folder');
            const f2 = document.getElementById('f-sel-folder');
            const html = folders.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
            f1.innerHTML = '<option value="all">📁 Semua Folder</option>' + html;
            f2.innerHTML = '<option value="">-- Tanpa Folder --</option>' + html;
        }

        function openManage() {
            renderManageList(); document.getElementById('m-manage').style.display = 'flex';
        }
        function renderManageList() {
            document.getElementById('manage-folder-list').innerHTML = folders.map(f => `
                <div style="display:flex; justify-content:space-between; background:var(--bg3); padding:8px 12px; border-radius:6px; font-size:13px;">
                    <span>📁 ${f.name}</span> <button class="btn-action danger" style="padding:2px 8px" onclick="delFolder('${f.id}')">Hapus</button>
                </div>`).join('');
            document.getElementById('manage-tag-list').innerHTML = tags.map(t => `
                <div style="display:flex; justify-content:space-between; background:var(--bg3); padding:8px 12px; border-radius:6px; font-size:13px;">
                    <span><span style="color:${t.color}">●</span> ${t.name}</span> <button class="btn-action danger" style="padding:2px 8px" onclick="delTag('${t.id}')">Hapus</button>
                </div>`).join('');
        }

        async function saveFolder() {
            const name = document.getElementById('new-folder-name').value; if(!name) return;
            const {data} = await db.from('folders').insert([{name}]).select().single();
            folders.push(data); populateFolderSelects(); renderManageList(); document.getElementById('new-folder-name').value='';
        }
        async function saveTag() {
            const name = document.getElementById('new-tag-name').value;
            const color = document.getElementById('new-tag-color').value; if(!name) return;
            const {data} = await db.from('tags').insert([{name, color}]).select().single();
            tags.push(data); renderManageList(); document.getElementById('new-tag-name').value='';
        }
        async function delFolder(id) { if(!confirm('Hapus folder?')) return; await db.from('folders').delete().eq('id',id); await loadData(); renderManageList(); }
        async function delTag(id) { if(!confirm('Hapus tag?')) return; await db.from('tags').delete().eq('id',id); await loadData(); renderManageList(); }

        // CORE LINK CRUD
        function openAdd() {
            editId = null; tempOgImage = ''; document.getElementById('m-link-ttl').innerText = 'Tambah Link';
            ['f-url','f-ttl','f-dsc','f-sel-folder'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('f-read-status').value = 'unread';
            
            document.getElementById('f-tags-container').innerHTML = tags.map(t => `
                <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" value="${t.id}"> <span style="color:${t.color}">●</span> ${t.name}</label>
            `).join('');
            document.getElementById('m-link').style.display = 'flex';
        }

        function openEdit(id) {
            const l = links.find(x => x.id === id); if (!l) return;
            editId = id; tempOgImage = l.og_image || ''; document.getElementById('m-link-ttl').innerText = 'Edit Link';
            document.getElementById('f-url').value = l.url; document.getElementById('f-ttl').value = l.title;
            document.getElementById('f-dsc').value = l.description || '';
            document.getElementById('f-sel-folder').value = l.folder_id || '';
            document.getElementById('f-read-status').value = l.read_status || 'unread';

            const selTags = link_tags.filter(lt => lt.link_id === id).map(lt => lt.tag_id);
            document.getElementById('f-tags-container').innerHTML = tags.map(t => `
                <label style="display:flex; align-items:center; gap:4px; font-size:12px; cursor:pointer;"><input type="checkbox" value="${t.id}" ${selTags.includes(t.id)?'checked':''}> <span style="color:${t.color}">●</span> ${t.name}</label>
            `).join('');
            document.getElementById('m-link').style.display = 'flex';
        }

        async function saveLink() {
            const payload = {
                url: document.getElementById('f-url').value,
                title: document.getElementById('f-ttl').value || document.getElementById('f-url').value,
                description: document.getElementById('f-dsc').value,
                folder_id: document.getElementById('f-sel-folder').value || null,
                read_status: document.getElementById('f-read-status').value,
                og_image: tempOgImage || null
            };
            const checkedTags = Array.from(document.querySelectorAll('#f-tags-container input:checked')).map(i => i.value);

            let linkId = editId;
            if (editId) {
                await db.from('links').update(payload).eq('id', editId);
                await db.from('link_tags').delete().eq('link_id', editId);
            } else {
                const { data } = await db.from('links').insert([payload]).select().single();
                linkId = data.id;
            }

            if (checkedTags.length > 0) {
                await db.from('link_tags').insert(checkedTags.map(tid => ({ link_id: linkId, tag_id: tid })));
            }

            document.getElementById('m-link').style.display = 'none';
            await loadData();
        }

        async function openUrl(id, url) {
            window.open(url, '_blank');
            const l = links.find(x => x.id === id); l.view_count++;
            await db.from('links').update({ view_count: l.view_count }).eq('id', id);
            renderGrid();
        }

        async function togglePin(id, state) { await db.from('links').update({ is_pinned: state }).eq('id', id); await loadData(); }
        async function cycleReadStatus(id, current) {
            const map = { 'unread': 'reading', 'reading': 'read', 'read': 'unread' };
            const next = map[current];
            await db.from('links').update({ read_status: next }).eq('id', id);
            await loadData();
        }

        async function fetchOGData() {
            const url = document.getElementById('f-url').value;
            const tEl = document.getElementById('f-ttl');
            if (!url || tEl.value) return;
            try {
                const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                const json = await res.json();
                if (json.status === 'success') {
                    if(!tEl.value) tEl.value = json.data.title || '';
                    if(!document.getElementById('f-dsc').value) document.getElementById('f-dsc').value = json.data.description || '';
                    if(json.data.image) tempOgImage = json.data.image.url;
                }
            } catch(e) {}
        }

        // BULK ACTIONS
        function toggleBulk(id) {
            if (selectedLinks.has(id)) selectedLinks.delete(id); else selectedLinks.add(id);
            const bar = document.getElementById('bulk-bar');
            if (selectedLinks.size > 0) { bar.classList.add('active'); document.getElementById('bulk-count').innerText = `${selectedLinks.size} link terpilih`; } 
            else { bar.classList.remove('active'); }
        }
        function clearBulk() { selectedLinks.clear(); document.getElementById('bulk-bar').classList.remove('active'); document.querySelectorAll('.cb-bulk').forEach(cb => cb.checked = false); }
        async function bulkDelete() {
            if (!confirm(`Hapus ${selectedLinks.size} link?`)) return;
            await db.from('links').delete().in('id', Array.from(selectedLinks));
            clearBulk(); await loadData();
        }
    </script>
</body>
</html>
