<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkVault</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #07070f;
            --bg2: #0d0d1c;
            --bg3: #12122a;
            --border: #1c1c38;
            --accent: #7c6aff;
            --accent2: #a78bfa;
            --text: #e4e4f4;
            --text2: #8888aa;
            --text3: #4a4a72;
            --danger: #ff4f6a;
            --success: #3dffa0;
            --pin: #ffd166;
            --r: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh
        }

        /* ── PASSWORD ── */
        #pw-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: radial-gradient(ellipse at 60% 40%, #1a103a 0%, var(--bg) 70%);
        }

        .pw-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 52px 44px;
            width: 360px;
            text-align: center;
            box-shadow: 0 0 80px rgba(124, 106, 255, .12);
        }

        .pw-logo {
            font-size: 42px;
            margin-bottom: 16px
        }

        .pw-card h1 {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 6px
        }

        .pw-card h1 span {
            color: var(--accent2)
        }

        .pw-card p {
            color: var(--text2);
            font-size: 12px;
            font-family: 'Space Mono', monospace;
            margin-bottom: 34px;
            letter-spacing: .5px
        }

        .pw-wrap input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 18px;
            font-family: 'Space Mono', monospace;
            letter-spacing: 6px;
            text-align: center;
            outline: none;
            transition: border-color .2s;
        }

        .pw-wrap input:focus {
            border-color: var(--accent)
        }

        .pw-wrap input.shake {
            border-color: var(--danger);
            animation: shake .4s
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-8px)
            }

            75% {
                transform: translateX(8px)
            }
        }

        .pw-btn {
            width: 100%;
            margin-top: 14px;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            letter-spacing: .5px;
        }

        .pw-btn:hover {
            background: var(--accent2);
            transform: translateY(-1px)
        }

        /* ── APP ── */
        #app {
            display: none;
            min-height: 100vh;
            flex-direction: column
        }

        /* HEADER */
        header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 62px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
            white-space: nowrap;
            letter-spacing: -0.5px
        }

        .logo b {
            color: var(--accent2)
        }

        .logo span {
            color: var(--text3);
            font-weight: 400
        }

        .search-wrap {
            flex: 1;
            max-width: 380px;
            position: relative
        }

        .search-wrap input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Syne', sans-serif;
            outline: none;
            transition: border-color .2s;
        }

        .search-wrap input:focus {
            border-color: var(--accent)
        }

        .search-wrap input::placeholder {
            color: var(--text3)
        }

        .s-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            pointer-events: none
        }

        .hdr-btns {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto
        }

        .btn-ico {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all .2s;
            flex-shrink: 0;
        }

        .btn-ico:hover {
            border-color: var(--accent);
            color: var(--accent2)
        }

        .btn-add-link {
            padding: 8px 16px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all .2s;
            white-space: nowrap;
        }

        .btn-add-link:hover {
            background: var(--accent2);
            transform: translateY(-1px)
        }

        /* STATS BAR */
        .stats-bar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            color: var(--text3);
        }

        .s-num {
            color: var(--accent2);
            font-weight: 700
        }

        /* CAT TABS */
        .cat-bar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 2px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
        }

        .cat-bar::-webkit-scrollbar {
            display: none
        }

        .c-tab {
            padding: 13px 15px;
            border: none;
            background: transparent;
            color: var(--text2);
            font-size: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 2px solid transparent;
            transition: all .2s;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .c-tab:hover {
            color: var(--text)
        }

        .c-tab.active {
            color: var(--accent2);
            border-bottom-color: var(--accent)
        }

        .c-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0
        }

        .c-cnt {
            font-size: 10px;
            background: var(--bg3);
            padding: 1px 7px;
            border-radius: 20px;
            color: var(--text3);
            font-family: 'Space Mono', monospace;
        }

        .btn-newcat {
            padding: 7px 13px;
            background: transparent;
            border: 1px dashed var(--border);
            border-radius: 6px;
            color: var(--text3);
            font-size: 11px;
            font-family: 'Syne', sans-serif;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 8px;
            transition: all .2s;
            flex-shrink: 0;
        }

        .btn-newcat:hover {
            border-color: var(--accent);
            color: var(--accent2)
        }

        /* MAIN */
        main {
            padding: 24px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%
        }

        /* GRID */
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
            gap: 12px;
        }

        /* CARD */
        .lcard {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px;
            cursor: pointer;
            transition: all .2s;
            position: relative;
            overflow: hidden;
            animation: fadeUp .3s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .lcard:hover {
            border-color: rgba(124, 106, 255, .5);
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(124, 106, 255, .12)
        }

        .lcard.pinned {
            border-color: rgba(255, 209, 102, .25)
        }

        .pin-tag {
            position: absolute;
            top: -1px;
            left: 13px;
            width: 18px;
            height: 18px;
            background: var(--pin);
            border-radius: 0 0 5px 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
        }

        .card-actions {
            display: none;
            position: absolute;
            top: 9px;
            right: 9px;
            gap: 4px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px;
        }

        .lcard:hover .card-actions {
            display: flex
        }

        .act {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            border: none;
            background: transparent;
            color: var(--text3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all .15s;
        }

        .act:hover {
            background: var(--bg3);
            color: var(--text)
        }

        .act.pin-on {
            color: var(--pin)
        }

        .act.del:hover {
            color: var(--danger)
        }

        .card-top {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 10px
        }

        .fav {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            background: var(--bg3);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .fav img {
            width: 18px;
            height: 18px;
            object-fit: contain
        }

        .c-meta {
            flex: 1;
            min-width: 0
        }

        .c-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px
        }

        .c-url {
            font-size: 10px;
            font-family: 'Space Mono', monospace;
            color: var(--text3);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .c-desc {
            font-size: 12px;
            color: var(--text2);
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px
        }

        .cat-badge {
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            font-family: 'Space Mono', monospace
        }

        .vc {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: var(--text3);
            font-family: 'Space Mono', monospace
        }

        /* EMPTY / LOADING */
        .empty {
            text-align: center;
            padding: 70px 20px;
            color: var(--text3);
            grid-column: 1/-1
        }

        .empty-ico {
            font-size: 44px;
            margin-bottom: 14px;
            opacity: .4
        }

        .empty h3 {
            font-size: 17px;
            color: var(--text2);
            margin-bottom: 6px
        }

        .empty p {
            font-size: 12px;
            font-family: 'Space Mono', monospace
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px;
            grid-column: 1/-1
        }

        .spin {
            width: 22px;
            height: 22px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .6s linear infinite
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        /* MODALS */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn .15s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 460px;
            animation: slideUp .2s ease;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .6);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 22px
        }

        .fg {
            margin-bottom: 16px
        }

        .fg label {
            display: block;
            font-size: 11px;
            font-family: 'Space Mono', monospace;
            color: var(--text3);
            margin-bottom: 5px;
            letter-spacing: .5px
        }

        .fg input,
        .fg textarea,
        .fg select {
            width: 100%;
            padding: 10px 13px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 13px;
            font-family: 'Syne', sans-serif;
            outline: none;
            transition: border-color .2s;
        }

        .fg input:focus,
        .fg textarea:focus,
        .fg select:focus {
            border-color: var(--accent)
        }

        .fg textarea {
            resize: none;
            height: 76px;
            line-height: 1.5
        }

        .fg select option {
            background: var(--bg3)
        }

        .color-row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap
        }

        .clr {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all .2s
        }

        .clr.sel {
            border-color: #fff;
            transform: scale(1.1)
        }

        .m-btns {
            display: flex;
            gap: 10px;
            margin-top: 22px;
            justify-content: flex-end
        }

        .btn-cancel {
            padding: 9px 18px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text2);
            font-size: 13px;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-cancel:hover {
            border-color: var(--text2);
            color: var(--text)
        }

        .btn-save {
            padding: 9px 22px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-save:hover {
            background: var(--accent2)
        }

        /* MANAGE CATS */
        .cat-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
            max-height: 240px;
            overflow-y: auto;
            margin-bottom: 10px
        }

        .ci {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg3);
            border-radius: 8px
        }

        .ci span {
            flex: 1;
            font-size: 13px;
            font-weight: 600
        }

        .ci small {
            font-size: 10px;
            color: var(--text3);
            font-family: 'Space Mono', monospace
        }

        .btn-del-cat {
            padding: 4px 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text3);
            font-size: 11px;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-del-cat:hover {
            border-color: var(--danger);
            color: var(--danger)
        }

        /* SETUP */
        .sql-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 13px;
            font-family: 'Space Mono', monospace;
            font-size: 10.5px;
            color: var(--success);
            white-space: pre;
            overflow-x: auto;
            line-height: 1.8;
            margin-bottom: 14px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 22px;
            right: 22px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 13px;
            color: var(--text);
            box-shadow: 0 8px 32px rgba(0, 0, 0, .4);
            z-index: 999;
            animation: toastIn .25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .toast.ok {
            border-left: 3px solid var(--success)
        }

        .toast.err {
            border-left: 3px solid var(--danger)
        }
    </style>
</head>

<body>

    <!-- ── PASSWORD SCREEN ── -->
    <div id="pw-screen">
        <div class="pw-card">
            <div class="pw-logo">🔗</div>
            <h1>Link<b>Vault</b></h1>
            <p>personal link manager</p>
            <div class="pw-wrap">
                <input type="password" id="pw-in" placeholder="••••••" maxlength="20" autocomplete="off">
            </div>
            <button class="pw-btn" onclick="checkPw()">Masuk →</button>
        </div>
    </div>

    <!-- ── MAIN APP ── -->
    <div id="app">

        <header>
            <div class="logo">Link<b>Vault</b><span>.io</span></div>
            <div class="search-wrap">
                <span class="s-icon">🔍</span>
                <input type="text" id="q" placeholder="Cari link… (Ctrl+K)" oninput="doSearch()">
            </div>
            <div class="hdr-btns">
                <button class="btn-ico" title="Kelola Kategori" onclick="openManage()">🗂️</button>
                <button class="btn-ico" title="Export JSON" onclick="exportJSON()">📤</button>
                <button class="btn-ico" title="Import JSON" onclick="document.getElementById('imp').click()">📥</button>
                <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
                <button class="btn-add-link" onclick="openAdd()">＋ Tambah Link</button>
            </div>
        </header>

        <div class="stats-bar">
            <span>📌 <span class="s-num" id="sp">0</span> pinned</span>
            <span>🔗 <span class="s-num" id="st">0</span> links</span>
            <span>🏷️ <span class="s-num" id="sc">0</span> kategori</span>
        </div>

        <div class="cat-bar" id="cat-bar">
            <button class="c-tab active" data-id="all" onclick="setCat('all',this)">Semua <span class="c-cnt"
                    id="ca">0</span></button>
            <button class="c-tab" data-id="pin" onclick="setCat('pin',this)">📌 Pinned <span class="c-cnt"
                    id="cp">0</span></button>
        </div>

        <main>
            <div class="links-grid" id="grid">
                <div class="loading">
                    <div class="spin"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ── ADD / EDIT LINK MODAL ── -->
    <div class="overlay" id="m-link" style="display:none" onclick="if(event.target===this)closeLink()">
        <div class="modal">
            <h2 id="m-link-ttl">＋ Tambah Link</h2>
            <div class="fg">
                <label>URL *</label>
                <input type="url" id="f-url" placeholder="https://…" oninput="autoTitle()">
            </div>
            <div class="fg">
                <label>JUDUL *</label>
                <input type="text" id="f-ttl" placeholder="Nama link…">
            </div>
            <div class="fg">
                <label>DESKRIPSI</label>
                <textarea id="f-dsc" placeholder="Catatan singkat…"></textarea>
            </div>
            <div class="fg">
                <label>KATEGORI</label>
                <select id="f-cat">
                    <option value="">— Tanpa Kategori —</option>
                </select>
            </div>
            <div class="m-btns">
                <button class="btn-cancel" onclick="closeLink()">Batal</button>
                <button class="btn-save" onclick="saveLink()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- ── ADD CATEGORY MODAL ── -->
    <div class="overlay" id="m-cat" style="display:none" onclick="if(event.target===this)closeCat()">
        <div class="modal">
            <h2>＋ Tambah Kategori</h2>
            <div class="fg">
                <label>NAMA *</label>
                <input type="text" id="cn" placeholder="cth: Dev Tools, Referensi…">
            </div>
            <div class="fg">
                <label>WARNA</label>
                <div class="color-row" id="clr-pick"></div>
            </div>
            <div class="m-btns">
                <button class="btn-cancel" onclick="closeCat()">Batal</button>
                <button class="btn-save" onclick="saveCat()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- ── MANAGE CATEGORIES MODAL ── -->
    <div class="overlay" id="m-manage" style="display:none" onclick="if(event.target===this)closeManage()">
        <div class="modal">
            <h2>🗂️ Kelola Kategori</h2>
            <div class="cat-list" id="cat-list"></div>
            <div class="m-btns">
                <button class="btn-cancel" onclick="closeManage()">Tutup</button>
                <button class="btn-save" onclick="closeManage();openCat()">＋ Tambah Baru</button>
            </div>
        </div>
    </div>

    <!-- ── SETUP DB MODAL ── -->
    <div class="overlay" id="m-setup" style="display:none">
        <div class="modal" style="max-width:540px">
            <h2>⚙️ Setup Database</h2>
            <p style="color:var(--text2);font-size:13px;margin-bottom:14px">
                Jalankan SQL ini di <strong>Supabase → SQL Editor</strong> lalu klik <em>Sudah Dibuat</em>.
            </p>
            <div class="sql-box" id="sql-box"></div>
            <button class="btn-save" style="width:100%;padding:11px" onclick="copySQL()">📋 Copy SQL</button>
            <div class="m-btns" style="margin-top:14px">
                <button class="btn-save" onclick="closeSetup();init()">✓ Sudah Dibuat, Lanjutkan</button>
            </div>
        </div>
    </div>

    <script>
        /* ─── CONFIG ─── */
        const SB_URL = 'https://tdoxttalxwunrweypybw.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkb3h0dGFseHd1bnJ3ZXlweWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTQ4NDIsImV4cCI6MjA5MzY3MDg0Mn0.X9-1HiW9uge5s2-Q85VF8hAgKp-u01xzf5JEGaoy0Rg';
        const PASS = '141516';
        const PALETTE = ['#7c6aff', '#f472b6', '#34d399', '#fbbf24', '#38bdf8', '#fb923c', '#e879f9', '#2dd4bf', '#f87171', '#60a5fa'];
        const SQL = `-- Jalankan di Supabase → SQL Editor

CREATE TABLE IF NOT EXISTS categories (
  id         UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  name       TEXT NOT NULL,
  color      TEXT DEFAULT '#7c6aff',
  created_at TIMESTAMPTZ DEFAULT NOW()
);

CREATE TABLE IF NOT EXISTS links (
  id          UUID DEFAULT gen_random_uuid() PRIMARY KEY,
  title       TEXT NOT NULL,
  url         TEXT NOT NULL,
  description TEXT,
  category_id UUID REFERENCES categories(id) ON DELETE SET NULL,
  is_pinned   BOOLEAN DEFAULT FALSE,
  view_count  INTEGER DEFAULT 0,
  created_at  TIMESTAMPTZ DEFAULT NOW()
);`;

        /* ─── STATE ─── */
        let db, cats = [], links = [], curCat = 'all', q = '', editId = null, pickColor = PALETTE[0];

        /* ─── PASSWORD ─── */
        const pwIn = document.getElementById('pw-in');
        pwIn.addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

        function checkPw() {
            if (pwIn.value === PASS) {
                document.getElementById('pw-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                document.getElementById('app').style.flexDirection = 'column';
                init();
            } else {
                pwIn.classList.add('shake');
                setTimeout(() => pwIn.classList.remove('shake'), 500);
                pwIn.value = '';
                pwIn.focus();
            }
        }

        /* ─── INIT ─── */
        async function init() {
            db = supabase.createClient(SB_URL, SB_KEY);
            await loadAll();
        }

        async function loadAll() {
            try {
                const [cr, lr] = await Promise.all([
                    db.from('categories').select('*').order('name'),
                    db.from('links').select('*').order('is_pinned', { ascending: false }).order('created_at', { ascending: false })
                ]);
                if (cr.error || lr.error) { showSetup(); return; }
                cats = cr.data || [];
                links = lr.data || [];
                renderTabs(); renderGrid(); fillCatSel(); updateStats();
            } catch (e) { showSetup(); }
        }

        /* ─── SETUP ─── */
        function showSetup() {
            document.getElementById('sql-box').textContent = SQL;
            document.getElementById('m-setup').style.display = 'flex';
        }
        function closeSetup() { document.getElementById('m-setup').style.display = 'none'; }
        function copySQL() { navigator.clipboard.writeText(SQL); toast('SQL disalin!'); }

        /* ─── TABS ─── */
        function renderTabs() {
            const bar = document.getElementById('cat-bar');
            while (bar.children.length > 2) bar.removeChild(bar.lastChild);

            cats.forEach(c => {
                const cnt = links.filter(l => l.category_id === c.id).length;
                const b = document.createElement('button');
                b.className = 'c-tab' + (curCat === c.id ? ' active' : '');
                b.dataset.id = c.id;
                b.onclick = () => setCat(c.id, b);
                b.innerHTML = `<span class="c-dot" style="background:${c.color}"></span>${esc(c.name)}<span class="c-cnt">${cnt}</span>`;
                bar.appendChild(b);
            });

            const nb = document.createElement('button');
            nb.className = 'btn-newcat'; nb.onclick = openCat; nb.innerHTML = '＋ Kategori';
            bar.appendChild(nb);

            document.getElementById('ca').textContent = links.length;
            document.getElementById('cp').textContent = links.filter(l => l.is_pinned).length;
        }

        function setCat(id, btn) {
            curCat = id;
            document.querySelectorAll('.c-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            renderGrid();
        }

        /* ─── GRID ─── */
        function renderGrid() {
            const g = document.getElementById('grid');
            g.innerHTML = '';

            let rows = [...links];
            if (curCat === 'pin') rows = rows.filter(l => l.is_pinned);
            else if (curCat !== 'all') rows = rows.filter(l => l.category_id === curCat);

            if (q) {
                const qq = q.toLowerCase();
                rows = rows.filter(l =>
                    l.title.toLowerCase().includes(qq) ||
                    l.url.toLowerCase().includes(qq) ||
                    (l.description || '').toLowerCase().includes(qq)
                );
            }

            if (!rows.length) {
                g.innerHTML = `<div class="empty"><div class="empty-ico">🔗</div><h3>Belum ada link</h3><p>Klik "+ Tambah Link" untuk mulai.</p></div>`;
                return;
            }

            rows.forEach((l, i) => {
                const cat = cats.find(c => c.id === l.category_id);
                const dom = getDomain(l.url);
                const fav = `https://www.google.com/s2/favicons?domain=${dom}&sz=32`;
                const d = document.createElement('div');
                d.className = 'lcard' + (l.is_pinned ? ' pinned' : '');
                d.style.animationDelay = `${i * 25}ms`;
                d.innerHTML = `
      ${l.is_pinned ? '<div class="pin-tag">📌</div>' : ''}
      <div class="card-actions">
        <button class="act ${l.is_pinned ? 'pin-on' : ''}" title="Pin" onclick="event.stopPropagation();togglePin('${l.id}')">📌</button>
        <button class="act" title="Edit" onclick="event.stopPropagation();openEdit('${l.id}')">✏️</button>
        <button class="act del" title="Hapus" onclick="event.stopPropagation();delLink('${l.id}')">🗑️</button>
      </div>
      <div class="card-top">
        <div class="fav"><img src="${fav}" onerror="this.parentNode.innerHTML='🌐'" alt=""></div>
        <div class="c-meta">
          <div class="c-title">${esc(l.title)}</div>
          <div class="c-url">${dom}</div>
        </div>
      </div>
      ${l.description ? `<div class="c-desc">${esc(l.description)}</div>` : ''}
      <div class="card-foot">
        ${cat ? `<span class="cat-badge" style="background:${cat.color}20;color:${cat.color}">${esc(cat.name)}</span>` : '<span></span>'}
        <span class="vc">👁 ${l.view_count || 0}</span>
      </div>`;
                d.addEventListener('click', () => openURL(l.id, l.url));
                g.appendChild(d);
            });
        }

        async function openURL(id, url) {
            window.open(url, '_blank', 'noopener');
            const l = links.find(x => x.id === id);
            if (!l) return;
            const nv = (l.view_count || 0) + 1;
            await db.from('links').update({ view_count: nv }).eq('id', id);
            l.view_count = nv;
            renderGrid();
        }

        /* ─── CAT SELECT ─── */
        function fillCatSel() {
            const s = document.getElementById('f-cat');
            const v = s.value;
            s.innerHTML = '<option value="">— Tanpa Kategori —</option>';
            cats.forEach(c => {
                const o = document.createElement('option');
                o.value = c.id; o.textContent = c.name; s.appendChild(o);
            });
            s.value = v;
        }

        /* ─── LINK MODAL ─── */
        function openAdd() {
            editId = null;
            document.getElementById('m-link-ttl').textContent = '＋ Tambah Link';
            ['f-url', 'f-ttl', 'f-dsc'].forEach(i => document.getElementById(i).value = '');
            document.getElementById('f-cat').value = '';
            document.getElementById('m-link').style.display = 'flex';
            setTimeout(() => document.getElementById('f-url').focus(), 80);
        }

        function openEdit(id) {
            const l = links.find(x => x.id === id); if (!l) return;
            editId = id;
            document.getElementById('m-link-ttl').textContent = '✏️ Edit Link';
            document.getElementById('f-url').value = l.url;
            document.getElementById('f-ttl').value = l.title;
            document.getElementById('f-dsc').value = l.description || '';
            document.getElementById('f-cat').value = l.category_id || '';
            document.getElementById('m-link').style.display = 'flex';
        }

        function closeLink() { document.getElementById('m-link').style.display = 'none'; }

        async function saveLink() {
            const url = document.getElementById('f-url').value.trim();
            const title = document.getElementById('f-ttl').value.trim();
            const desc = document.getElementById('f-dsc').value.trim();
            const catId = document.getElementById('f-cat').value;
            if (!url) { toast('URL wajib diisi!', 'err'); return; }
            if (!title) { toast('Judul wajib diisi!', 'err'); return; }
            const data = { url, title, description: desc || null, category_id: catId || null };
            if (editId) {
                const { error } = await db.from('links').update(data).eq('id', editId);
                if (error) { toast('Gagal: ' + error.message, 'err'); return; }
                const i = links.findIndex(l => l.id === editId);
                if (i > -1) links[i] = { ...links[i], ...data };
                toast('Link diupdate ✓');
            } else {
                const { data: nl, error } = await db.from('links').insert([data]).select().single();
                if (error) { toast('Gagal: ' + error.message, 'err'); return; }
                links.unshift(nl);
                toast('Link ditambahkan ✓');
            }
            closeLink(); renderTabs(); renderGrid(); updateStats();
        }

        async function delLink(id) {
            if (!confirm('Hapus link ini?')) return;
            const { error } = await db.from('links').delete().eq('id', id);
            if (error) { toast('Gagal: ' + error.message, 'err'); return; }
            links = links.filter(l => l.id !== id);
            renderTabs(); renderGrid(); updateStats();
            toast('Dihapus.');
        }

        async function togglePin(id) {
            const l = links.find(x => x.id === id); if (!l) return;
            const nv = !l.is_pinned;
            const { error } = await db.from('links').update({ is_pinned: nv }).eq('id', id);
            if (error) { toast('Gagal', 'err'); return; }
            l.is_pinned = nv;
            renderTabs(); renderGrid(); updateStats();
        }

        /* ─── AUTO-TITLE ─── */
        let _at;
        function autoTitle() {
            clearTimeout(_at);
            _at = setTimeout(() => {
                const url = document.getElementById('f-url').value.trim();
                const tf = document.getElementById('f-ttl');
                if (url && !tf.value) { try { tf.value = new URL(url).hostname.replace('www.', ''); } catch (e) { } }
            }, 600);
        }

        /* ─── CAT MODAL ─── */
        function openCat() {
            document.getElementById('cn').value = '';
            pickColor = PALETTE[0];
            renderPicker();
            document.getElementById('m-cat').style.display = 'flex';
            setTimeout(() => document.getElementById('cn').focus(), 80);
        }
        function closeCat() { document.getElementById('m-cat').style.display = 'none'; }

        function renderPicker() {
            const w = document.getElementById('clr-pick');
            w.innerHTML = '';
            PALETTE.forEach(c => {
                const d = document.createElement('div');
                d.className = 'clr' + (c === pickColor ? ' sel' : '');
                d.style.background = c;
                d.onclick = () => { pickColor = c; renderPicker(); };
                w.appendChild(d);
            });
        }

        async function saveCat() {
            const name = document.getElementById('cn').value.trim();
            if (!name) { toast('Nama wajib!', 'err'); return; }
            const { data: nc, error } = await db.from('categories').insert([{ name, color: pickColor }]).select().single();
            if (error) { toast('Gagal: ' + error.message, 'err'); return; }
            cats.push(nc); cats.sort((a, b) => a.name.localeCompare(b.name));
            closeCat(); renderTabs(); fillCatSel(); updateStats();
            toast('Kategori ditambahkan ✓');
        }

        /* ─── MANAGE MODAL ─── */
        function openManage() {
            renderManageList();
            document.getElementById('m-manage').style.display = 'flex';
        }
        function closeManage() { document.getElementById('m-manage').style.display = 'none'; }

        function renderManageList() {
            const el = document.getElementById('cat-list');
            if (!cats.length) { el.innerHTML = '<p style="color:var(--text3);font-size:12px;text-align:center;padding:20px;font-family:Space Mono,monospace">Belum ada kategori</p>'; return; }
            el.innerHTML = cats.map(c => `
    <div class="ci">
      <div class="c-dot" style="background:${c.color}"></div>
      <span>${esc(c.name)}</span>
      <small>${links.filter(l => l.category_id === c.id).length} links</small>
      <button class="btn-del-cat" onclick="delCat('${c.id}')">Hapus</button>
    </div>`).join('');
        }

        async function delCat(id) {
            if (!confirm('Hapus kategori? Link di dalamnya tetap ada.')) return;
            const { error } = await db.from('categories').delete().eq('id', id);
            if (error) { toast('Gagal: ' + error.message, 'err'); return; }
            cats = cats.filter(c => c.id !== id);
            links.forEach(l => { if (l.category_id === id) l.category_id = null; });
            if (curCat === id) curCat = 'all';
            renderManageList(); renderTabs(); renderGrid(); fillCatSel(); updateStats();
            toast('Kategori dihapus.');
        }

        /* ─── SEARCH ─── */
        function doSearch() { q = document.getElementById('q').value.trim(); renderGrid(); }

        /* ─── STATS ─── */
        function updateStats() {
            document.getElementById('st').textContent = links.length;
            document.getElementById('sp').textContent = links.filter(l => l.is_pinned).length;
            document.getElementById('sc').textContent = cats.length;
        }

        /* ─── EXPORT / IMPORT ─── */
        function exportJSON() {
            const blob = new Blob([JSON.stringify({ categories: cats, links, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `linkvault-${Date.now()}.json`;
            a.click();
            toast('Data diexport ✓');
        }

        async function importJSON(ev) {
            const file = ev.target.files[0]; if (!file) return;
            try {
                const data = JSON.parse(await file.text());
                if (!data.links) { toast('Format tidak valid', 'err'); return; }
                for (const c of data.categories || []) {
                    if (!cats.find(x => x.name === c.name)) {
                        const { data: nc } = await db.from('categories').insert([{ name: c.name, color: c.color || PALETTE[0] }]).select().single();
                        if (nc) cats.push(nc);
                    }
                }
                for (const l of data.links) {
                    if (!links.find(x => x.url === l.url)) {
                        const mc = cats.find(c => c.name === (data.categories || []).find(dc => dc.id === l.category_id)?.name);
                        await db.from('links').insert([{ title: l.title, url: l.url, description: l.description, category_id: mc?.id || null, is_pinned: l.is_pinned || false }]);
                    }
                }
                await loadAll();
                toast('Import berhasil ✓');
            } catch (e) { toast('Gagal import: ' + e.message, 'err'); }
            ev.target.value = '';
        }

        /* ─── UTILS ─── */
        function getDomain(u) { try { return new URL(u).hostname; } catch { return u; } }
        function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function toast(msg, type = 'ok') {
            document.querySelector('.toast')?.remove();
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML = (type === 'ok' ? '✓ ' : '✕ ') + msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        /* ─── KEYBOARD ─── */
        document.addEventListener('keydown', e => {
            if (document.getElementById('app').style.display === 'none') return;
            if (e.key === 'Escape') { closeLink(); closeCat(); closeManage(); }
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('q').focus(); }
        });
    </script>
</body>

</html>
