<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkVault Pro</title>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Marked.js untuk Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #07070f;
            --bg2: #0d0d1c;
            --bg3: #12122a;
            --border: #1c1c38;
            --accent: #7c6aff;
            --accent2: #a78bfa;
            --text: #e4e4f4;
            --text2: #8888aa;
            --text3: #4a4a72;
            --danger: #ff4f6a;
            --success: #3dffa0;
            --pin: #ffd166;
            --r: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* PASSWORD & UI UTILS (Dipersingkat agar rapi) */
        #pw-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: var(--bg);
        }

        .pw-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 52px 44px;
            width: 360px;
            text-align: center;
        }

        .pw-wrap input {
            width: 100%;
            padding: 14px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-align: center;
            outline: none;
            margin: 20px 0;
            letter-spacing: 5px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #app {
            display: none;
            min-height: 100vh;
            flex-direction: column;
        }

        header {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 62px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 21px;
            font-weight: 800;
        }

        .logo b {
            color: var(--accent2);
        }

        .search-wrap {
            flex: 1;
            display: flex;
            gap: 10px;
            max-width: 600px;
        }

        .search-wrap input,
        .search-wrap select {
            padding: 9px 14px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            outline: none;
            font-size: 13px;
        }

        .search-wrap input {
            flex: 1;
        }

        .hdr-btns {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .btn-ico {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
        }

        .stats-bar,
        .cat-bar {
            background: var(--bg2);
            border-bottom: 1px solid var(--border);
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            font-size: 12px;
            overflow-x: auto;
        }

        main {
            padding: 24px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* KARTU LINK & OG IMAGE */
        .lcard {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .lcard:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .lcard.pinned {
            border-color: rgba(255, 209, 102, .4);
        }

        .card-img {
            width: 100%;
            height: 130px;
            background: var(--bg3);
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .card-body {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            background: rgba(13, 13, 28, 0.9);
            padding: 4px;
            border-radius: 8px;
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: .2s;
        }

        .lcard:hover .card-actions,
        .lcard.selected .card-actions {
            opacity: 1;
        }

        .act-btn,
        .cb-bulk {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            border: none;
            background: transparent;
            color: var(--text);
            cursor: pointer;
        }

        .act-btn:hover {
            background: var(--bg3);
        }

        .c-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .c-title {
            font-weight: bold;
            font-size: 15px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* MARKDOWN STYLING */
        .c-desc {
            font-size: 12px;
            color: var(--text2);
            line-height: 1.6;
            margin-bottom: 12px;
            flex: 1;
        }

        .c-desc.mkd h1,
        .c-desc.mkd h2,
        .c-desc.mkd h3 {
            font-size: 13px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .c-desc.mkd p {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .c-desc.mkd code {
            background: var(--bg3);
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
            color: var(--accent2);
        }

        .c-desc.mkd ul {
            padding-left: 16px;
            margin-bottom: 4px;
        }

        .card-foot {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: auto;
            justify-content: space-between;
            align-items: center;
        }

        .tags-wrap {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .tag-badge {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-family: monospace;
        }

        /* MODALS & FORMS */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .8);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
        }

        .fg {
            margin-bottom: 14px;
        }

        .fg label {
            display: block;
            font-size: 11px;
            color: var(--text3);
            margin-bottom: 6px;
        }

        .fg input,
        .fg textarea,
        .fg select {
            width: 100%;
            padding: 10px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
        }

        .fg textarea {
            height: 100px;
            font-family: monospace;
        }

        /* MULTI-TAG SELECTOR UI */
        .tag-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: var(--bg3);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .tag-check {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .tag-check input {
            display: none;
        }

        .tag-check.checked {
            border-color: var(--accent);
            background: rgba(124, 106, 255, 0.1);
        }

        /* BULK ACTION BAR */
        .bulk-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg2);
            border: 1px solid var(--accent);
            padding: 12px 24px;
            border-radius: 30px;
            display: none;
            gap: 16px;
            align-items: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            z-index: 150;
        }

        .bulk-bar.active {
            display: flex;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-action:hover {
            background: var(--bg3);
        }

        .btn-action.danger {
            color: var(--danger);
            border-color: var(--danger);
        }
    </style>
</head>

<body>

    <!-- PASSWORD -->
    <div id="pw-screen">
        <div class="pw-card">
            <h2>LinkVault Pro</h2>
            <div class="pw-wrap"><input type="password" id="pw-in" placeholder="••••••" autocomplete="off"></div>
            <button class="btn-primary" onclick="checkPw()">Masuk</button>
        </div>
    </div>

    <!-- APP -->
    <div id="app">
        <header>
            <div class="logo">Link<b>Vault</b></div>
            <div class="search-wrap">
                <input type="text" id="q" placeholder="Cari link..." oninput="renderGrid()">
                <select id="f-sort" onchange="renderGrid()">
                    <option value="newest">Terbaru</option>
                    <option value="views">Paling Sering Dibuka</option>
                    <option value="az">A - Z</option>
                </select>
                <select id="f-filter" onchange="renderGrid()">
                    <option value="all">Semua</option>
                    <option value="unvisited">Belum Dikunjungi</option>
                    <option value="this_month">Dibuat Bulan Ini</option>
                </select>
            </div>
            <div class="hdr-btns">
                <button class="btn-ico" onclick="openManage()">🗂</button>
                <button class="btn-primary" style="width:auto; padding:8px 16px;" onclick="openAdd()">＋ Tambah</button>
            </div>
        </header>

        <div class="cat-bar" id="tag-bar"></div>

        <main>
            <div class="links-grid" id="grid"></div>
        </main>

        <!-- BULK BAR -->
        <div class="bulk-bar" id="bulk-bar">
            <span id="bulk-count">0 terpilih</span>
            <button class="btn-action danger" onclick="bulkDelete()">Hapus Massal</button>
            <button class="btn-action" onclick="clearBulk()">Batal</button>
        </div>
    </div>

    <!-- MODAL LINK -->
    <div class="overlay" id="m-link" style="display:none" onclick="if(event.target===this)this.style.display='none'">
        <div class="modal">
            <h2 id="m-link-ttl">Tambah Link</h2>
            <div class="fg">
                <label>URL *</label>
                <input type="url" id="f-url" onblur="fetchOGData()" placeholder="https://...">
            </div>
            <div class="fg">
                <label>JUDUL * (Auto Fetch jika kosong)</label>
                <input type="text" id="f-ttl">
            </div>
            <div class="fg">
                <label>DESKRIPSI (Mendukung Markdown)</label>
                <textarea id="f-dsc" placeholder="# Heading&#10;- Point 1"></textarea>
            </div>
            <div class="fg">
                <label>TAGS (Bisa pilih lebih dari satu)</label>
                <div class="tag-grid" id="f-tags-container"></div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn-action"
                    onclick="document.getElementById('m-link').style.display='none'">Batal</button>
                <button class="btn-primary" style="width:auto;" onclick="saveLink()">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://tdoxttalxwunrweypybw.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkb3h0dGFseHd1bnJ3ZXlweWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTQ4NDIsImV4cCI6MjA5MzY3MDg0Mn0.X9-1HiW9uge5s2-Q85VF8hAgKp-u01xzf5JEGaoy0Rg';
        const PASS = '141516';

        let db, tags = [], links = [], link_tags = [], activeTag = 'all', editId = null;
        let selectedLinks = new Set(), tempOgImage = '';

        function checkPw() {
            if (document.getElementById('pw-in').value === PASS) {
                document.getElementById('pw-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                init();
            }
        }

        async function init() {
            db = supabase.createClient(SB_URL, SB_KEY);
            await loadData();
        }

        async function loadData() {
            const [tRes, lRes, ltRes] = await Promise.all([
                db.from('tags').select('*'),
                db.from('links').select('*'),
                db.from('link_tags').select('*')
            ]);
            tags = tRes.data || [];
            links = lRes.data || [];
            link_tags = ltRes.data || [];
            renderTagBar();
            renderGrid();
        }

        // --- RENDER UI ---
        function renderTagBar() {
            const bar = document.getElementById('tag-bar');
            bar.innerHTML = `<button class="btn-action ${activeTag === 'all' ? 'danger' : ''}" onclick="setActiveTag('all')">Semua</button>`;
            tags.forEach(t => {
                const count = link_tags.filter(lt => lt.tag_id === t.id).length;
                bar.innerHTML += `<button class="btn-action ${activeTag === t.id ? 'danger' : ''}" style="border-color:${t.color}" onclick="setActiveTag('${t.id}')">${t.name} (${count})</button>`;
            });
        }

        function setActiveTag(id) { activeTag = id; renderTagBar(); renderGrid(); }

        function renderGrid() {
            const g = document.getElementById('grid');
            const q = document.getElementById('q').value.toLowerCase();
            const sort = document.getElementById('f-sort').value;
            const filter = document.getElementById('f-filter').value;
            const now = new Date();

            let data = links.filter(l => {
                // Search filter
                const matchQ = l.title.toLowerCase().includes(q) || l.url.toLowerCase().includes(q);
                // Tag filter
                const matchTag = activeTag === 'all' || link_tags.some(lt => lt.link_id === l.id && lt.tag_id === activeTag);
                // Adv filter
                let matchAdv = true;
                if (filter === 'unvisited') matchAdv = l.view_count === 0;
                if (filter === 'this_month') {
                    const lDate = new Date(l.created_at);
                    matchAdv = lDate.getMonth() === now.getMonth() && lDate.getFullYear() === now.getFullYear();
                }
                return matchQ && matchTag && matchAdv;
            });

            // Sorting
            data.sort((a, b) => {
                if (a.is_pinned !== b.is_pinned) return b.is_pinned - a.is_pinned; // Pin always top
                if (sort === 'newest') return new Date(b.created_at) - new Date(a.created_at);
                if (sort === 'views') return b.view_count - a.view_count;
                if (sort === 'az') return a.title.localeCompare(b.title);
            });

            g.innerHTML = data.map(l => {
                const lTags = link_tags.filter(lt => lt.link_id === l.id).map(lt => tags.find(t => t.id === lt.tag_id)).filter(Boolean);
                const tagHtml = lTags.map(t => `<span class="tag-badge" style="background:${t.color}20;color:${t.color}">${t.name}</span>`).join('');
                const imgHtml = l.og_image ? `<img src="${l.og_image}" class="card-img" onerror="this.style.display='none'">` : '';
                const isSel = selectedLinks.has(l.id) ? 'checked' : '';
                const rawDesc = l.description || '';
                const mdDesc = marked.parse(rawDesc); // Render Markdown

                return `
                <div class="lcard ${l.is_pinned ? 'pinned' : ''}" onclick="openUrl('${l.id}', '${l.url}')">
                    ${imgHtml}
                    <div class="card-actions">
                        <input type="checkbox" class="cb-bulk" ${isSel} onclick="event.stopPropagation(); toggleBulk('${l.id}')">
                        <button class="act-btn" onclick="event.stopPropagation(); togglePin('${l.id}', ${!l.is_pinned})">📌</button>
                        <button class="act-btn" onclick="event.stopPropagation(); openEdit('${l.id}')">✏️</button>
                    </div>
                    <div class="card-body">
                        <div class="c-meta"><div class="c-title">${l.title}</div></div>
                        <div class="c-desc mkd">${mdDesc}</div>
                        <div class="card-foot">
                            <div class="tags-wrap">${tagHtml}</div>
                            <span style="font-size:10px; color:var(--text3)">👁 ${l.view_count}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // --- FETCH OPEN GRAPH API ---
        async function fetchOGData() {
            const url = document.getElementById('f-url').value;
            const tEl = document.getElementById('f-ttl');
            const dEl = document.getElementById('f-dsc');
            if (!url || tEl.value) return;

            tEl.placeholder = 'Fetching metadata...';
            try {
                // Menggunakan API Microlink gratis untuk parsing meta tag & gambar Open Graph
                const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
                const json = await res.json();
                if (json.status === 'success') {
                    if (!tEl.value) tEl.value = json.data.title || '';
                    if (!dEl.value) dEl.value = json.data.description || '';
                    if (json.data.image) tempOgImage = json.data.image.url;
                }
            } catch (e) { console.log('OG Fetch fail', e); }
            tEl.placeholder = '';
        }

        // --- LINK ACTIONS ---
        function openAdd() {
            editId = null; tempOgImage = '';
            document.getElementById('m-link-ttl').innerText = 'Tambah Link';
            document.getElementById('f-url').value = '';
            document.getElementById('f-ttl').value = '';
            document.getElementById('f-dsc').value = '';
            renderTagSelector();
            document.getElementById('m-link').style.display = 'flex';
        }

        function renderTagSelector(selectedTagIds = []) {
            const c = document.getElementById('f-tags-container');
            c.innerHTML = tags.map(t => {
                const isChecked = selectedTagIds.includes(t.id);
                return `<label class="tag-check ${isChecked ? 'checked' : ''}">
                    <input type="checkbox" value="${t.id}" ${isChecked ? 'checked' : ''} onchange="this.parentElement.classList.toggle('checked')">
                    <span style="color:${t.color}">●</span> ${t.name}
                </label>`;
            }).join('');
        }

        async function saveLink() {
            const url = document.getElementById('f-url').value;
            const title = document.getElementById('f-ttl').value || url;
            const description = document.getElementById('f-dsc').value;

            // Ambil semua tag yang dicentang
            const tagInputs = document.querySelectorAll('#f-tags-container input:checked');
            const selectedTags = Array.from(tagInputs).map(i => i.value);

            let linkId = editId;
            const linkData = { url, title, description, og_image: tempOgImage || null };

            if (editId) {
                await db.from('links').update(linkData).eq('id', editId);
                await db.from('link_tags').delete().eq('link_id', editId); // Reset tags
            } else {
                const { data } = await db.from('links').insert([linkData]).select().single();
                linkId = data.id;
            }

            // Insert Many-to-Many Tags
            if (selectedTags.length > 0) {
                const tagPayload = selectedTags.map(tId => ({ link_id: linkId, tag_id: tId }));
                await db.from('link_tags').insert(tagPayload);
            }

            document.getElementById('m-link').style.display = 'none';
            await loadData();
        }

        async function openUrl(id, url) {
            window.open(url, '_blank');
            // Log visit history & increment counter
            await db.from('visit_logs').insert([{ link_id: id }]);

            const l = links.find(x => x.id === id);
            l.view_count++;
            await db.from('links').update({ view_count: l.view_count }).eq('id', id);
            renderGrid();
        }

        async function togglePin(id, state) {
            await db.from('links').update({ is_pinned: state }).eq('id', id);
            await loadData();
        }

        // --- BULK ACTIONS ---
        function toggleBulk(id) {
            if (selectedLinks.has(id)) selectedLinks.delete(id);
            else selectedLinks.add(id);

            const bar = document.getElementById('bulk-bar');
            if (selectedLinks.size > 0) {
                bar.classList.add('active');
                document.getElementById('bulk-count').innerText = `${selectedLinks.size} link terpilih`;
            } else {
                bar.classList.remove('active');
            }
        }

        function clearBulk() {
            selectedLinks.clear();
            document.getElementById('bulk-bar').classList.remove('active');
            document.querySelectorAll('.cb-bulk').forEach(cb => cb.checked = false);
        }

        async function bulkDelete() {
            if (!confirm(`Hapus ${selectedLinks.size} link secara permanen?`)) return;
            const ids = Array.from(selectedLinks);
            await db.from('links').delete().in('id', ids);
            clearBulk();
            await loadData();
        }
    </script>
</body>

</html>
